<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="../src/css/style.css">
  <link rel="stylesheet" href="../src/css/admin.css">
</head>
<body>
  <header>
    <h1>Admin Dashboard</h1>
  </header>

  <section class="metrics">
    <div class="card">
      <h3>Total Users</h3>
      <span id="total-users">0</span>
    </div>
    <div class="card">
      <h3>Total Listings</h3>
      <span id="total-listings">0</span>
    </div>
  </section>

  <section class="listings-table">
    <h2>All Listings</h2>
    <table id="listings">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Price</th>
          <th>Status</th>
          <th>Seller</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows populated by JS -->
      </tbody>
    </table>
  </section>

  <script type="module" src="../src/js/adminDashboard.js"></script>
</body>
</html>
