<!-- Pete's Plaza Marketplace Web App Homepage -->
 
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pete's Plaza | Home</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>

<body>
  <div class="page">

    <!-- TOP UTILITY BAR -->
    <header class="topbar">
      <div class="top-center">
      <!-- SITE HEADER -->
        <div class="site-header">
          <img src="assets/IMG_0269 (1).png" alt="Pete's Plaza Logo" class="header-image">
          <div class="create-title site-title">
            Pete’s Plaza
          </div>
        </div>
        <!-- TOP RIGHT BUTTONS -->
        <div class="top-buttons">
          <button class="pill" id="btnProfile">Profile</button>
          <button class="pill" id="btnWishlist">Wishlist</button>
          <button class="pill" id="btnCart">Cart</button>
          <button class="pill" id="btnContactTop">Contact</button>
        </div>

      </div>
    </header>

    
    

    <!-- NAVIGATION ROW -->
    <nav class="navrow">
      <div class="tabs" id="tabs">
        <button class="tab active" data-page="Home">Home</button>
        <button class="tab" data-page="Men's">Men's</button>
        <button class="tab" data-page="Women's">Women's</button>
        <button class="tab" data-page="Accessories">Accessories</button>
        <button class="tab" data-page="Contact Us">Contact Us (Support)</button>
      </div>

      <!-- CREATE LISTING -->
      <button class="pill create-btn" id="btnCreateListing">
        Create a Listing
      </button>
    </nav>

    <!-- MAIN LAYOUT -->
    <div class="layout">

      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="sidebox">
          <div class="sidebox-title">Current Listing</div>

          <button class="category" data-cat="T-Shirts">T-Shirts</button>
          <button class="category" data-cat="Jeans">Jeans</button>
          <button class="category" data-cat="Sweatshirts">Sweatshirts</button>
          <button class="category" data-cat="Shoes">Shoes</button>
          <button class="category" data-cat="Appliances">Appliances</button>
          <button class="category" data-cat="Furniture">Furniture</button>
        </div>

        <button class="settings" id="btnSettings">Settings</button>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main">
        <div class="canvas">
          <h1 id="pageTitle">Home</h1>
          <p id="pageDesc">
            Listings
          </p>
          

          <div class="cards" id="cards">

            <div class="card" data-cat="T-Shirts">
              <div class="img"></div>
              <h3>Graphic T-Shirt</h3>
              <p>$12.99 • T-Shirts</p>
            </div>

            <div class="card" data-cat="Jeans">
              <div class="img"></div>
              <h3>Blue Jeans</h3>
              <p>$29.99 • Jeans</p>
            </div>

            <div class="card" data-cat="Shoes">
              <div class="img"></div>
              <h3>Running Shoes</h3>
              <p>$45.00 • Shoes</p>
            </div>

            <div class="card" data-cat="Furniture">
              <div class="img"></div>
              <h3>Office Chair</h3>
              <p>$60.00 • Furniture</p>
            </div>

            <div class="card" data-cat="Accessories">
              <div class="img"></div>
              <h3>Backpack</h3>
              <p>$22.00 • Accessories</p>
            </div>

            <div class="card" data-cat="Appliances">
              <div class="img"></div>
              <h3>Mini Blender</h3>
              <p>$18.50 • Appliances</p>
            </div>

          </div>
        </div>
      </main>

    </div>
  </div>
  
  <!-- LOGIN / SIGNUP MODAL -->
<div class="modal hidden" id="authModal">
  <div class="modal-content">

    <button class="close-btn" id="closeModal">×</button>

    <h2>User Account</h2>

    <div class="auth-forms">

      <!-- LOGIN -->
      <div class="auth-box">
        <h3>Login</h3>
        <input type="text" placeholder="Username" />
        <input type="password" placeholder="Password" />
        <button class="pill auth-btn">Login</button>
      </div>

      <!-- SIGN UP -->
      <div class="auth-box">
        <h3>Sign Up</h3>
        <input type="text" placeholder="Username" />
        <input type="email" placeholder="Email" />
        <input type="password" placeholder="Password" />
        <button class="pill auth-btn">Create Account</button>
      </div>

    </div>
  </div>
</div>
<!-- WISHLIST MODAL -->
<div class="modal hidden" id="wishlistModal">
  <div class="modal-content wishlist-content">
    <button class="close-btn" id="closeWishlist">×</button>

    <h2>My Wishlist</h2>
    <p class="muted" id="wishlistHint"></p>

    <div id="wishlistList" class="wishlist-list"></div>
  </div>
</div>

</body>
</html>
